[profile.default]
src = "."
test = "test"
out = "out"
libs = ["lib", "../../../node_modules"]
remappings = [
    "@openzeppelin/=../../../node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
    "cc3/=../"
]
solc_version = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = false
