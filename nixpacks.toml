[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]
aptPkgs = []

[phases.install]
cmds = [
  "cd backend && corepack enable && corepack prepare pnpm@latest --activate",
  "cd backend && pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "cd backend && pnpm run migrate || echo 'Migration will run on startup'"
]

[start]
cmd = "cd backend && npx tsx src/main.ts"
